[package]
name = "ikigai-name"
version = "0.6.0"
edition = "2021"
# Measured 2026-10-14 (ledger #195), not guessed: on 1.87, clippy -D warnings and the
# tests pass with and without `server`; on 1.86 the library itself fails (ikigai-core
# 0.1.103 calls `is_multiple_of`, stable in 1.87) and the dev and server graphs are
# refused outright (oxrdf, spargebra and the rest of oxigraph 0.5 declare 1.87).
# Declaring it is what makes the shared CI's msrv job run rather than skip.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Persistent-identifier resolution as an ikigai module: urn:name:* resolves curated IRIs against an externalized, capability-scoped registry — hosted, redirected or mirrored — so a namespace outlives the domain that first served it."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-name"
homepage = "https://github.com/ikigai-rs/ikigai-name"
readme = "README.md"
keywords = ["ikigai", "roc", "iri", "purl", "rdf"]
categories = ["web-programming", "data-structures"]

[dependencies]
# 0.2.0 is the streams release (ledger #2261). The old 0.1 pin meant
# <0.2.0 under 0.x caret rules; this floor admits compatible 0.2.x patches.
ikigai-core = "0.2.0"
ikigai-fn = "0.7.0"
async-trait = "0.1"
# The registry is data the operator edits, so it is parsed, not compiled in.
# JSON matches the house configuration format (edge-routes.json, clients.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The contrast floor. Used for its color maths, so the documentation palettes
# are CHECKED rather than asserted — a page a newcomer must read is the wrong
# place to discover that "muted" meant "illegible".
ikigai-a11y = "0.4.0"
# The signature on a repository's push webhook, which only a shared key can make.
hmac = "0.12"
sha2 = "0.10"

# Server-only transports and stores, released against the streams core.
# SPARQL retains the typed missing-query refusal tested by conformance.
ikigai-web = { version = "0.2.0", optional = true }
ikigai-fs = { version = "0.2.2", optional = true }
ikigai-sparql = { version = "0.3.1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"], optional = true }
# The vendored htmx the documentation page loads, as `urn:iki:ui:htmx` (ledger #2737):
# the shared home for it, rather than a private copy. 0.4.0 is the release on core 0.2;
# a caret on it is <0.5.0.
ikigai-ui = { version = "0.4.0", optional = true }
# The modules and the client behind `--git`, and only behind it (see below): an outbound
# HTTP client, the secret store and the validator without rudof, each on core 0.2.
ikigai-http = { version = "0.4.3", optional = true }
ikigai-secret = { version = "0.3.0", optional = true }
ikigai-shacl = { version = "0.5.0", default-features = false, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
futures-util = { version = "0.3", features = ["io"], optional = true }

# --- the standalone server ---------------------------------------------------
# Optional, so a library consumer never builds an HTTP stack or RocksDB. The
# feature list IS the server's module manifest, in the ikigai-dev-server sense:
# this binary links these and nothing else, so what it cannot reach is a
# property of the build rather than of a config file.
[features]
server = ["dep:ikigai-web", "dep:ikigai-sparql", "dep:ikigai-fs", "dep:ikigai-ui", "dep:tokio"]
# Namespaces served from git repositories. Separate, because the plain server's claim is
# that it links no secrets and no outbound network, and that claim is about its build.
git = ["server", "dep:ikigai-http", "dep:ikigai-secret", "dep:ikigai-shacl", "dep:reqwest", "dep:futures-util", "tokio/sync"]

[[bin]]
name = "ikigai-name-server"
path = "src/bin/server.rs"
required-features = ["server"]

# Spawns the server binary, so it needs the same feature; CI's `features: "*"`
# enables it (a `required-features` target is otherwise silently skipped).
[[test]]
name = "server_http"
path = "tests/server_http.rs"
required-features = ["server"]

# The Host-keyed tenants, through the real binary, so the same feature applies.
[[test]]
name = "tenancy_http"
path = "tests/tenancy_http.rs"
required-features = ["server"]

# The counts, end to end: names resolved over HTTP, stored by the flush task.
[[test]]
name = "active_names_http"
path = "tests/active_names_http.rs"
required-features = ["server"]

# A push, a shape's refusal and a vanished repository, through the real binary.
[[test]]
name = "git_http"
path = "tests/git_http.rs"
required-features = ["git"]

[dev-dependencies]
futures = "0.3"
# Walk every bound endpoint, including DATATYPES, FAILURES, BODIES and
# BODY-INPUTS by default (0.12.0; ledger #2581).
ikigai-conformance = "0.12.0"
# Match the server's real SPARQL engine for the conformance walk.
ikigai-sparql = "0.3.1"
# The real urn:repo:log behind as-of resolution, over a scratch repository. 0.3.x
# because that is the line on core 0.2: 0.4.0 is on core 0.3, and ikigai-web has no
# release on core 0.3 for the server to move with it.
ikigai-repo = "0.3.2"
# The real validator and secret store behind a repository-backed namespace, each on the
# line that is on core 0.2. The validator without rudof, which it does not need here:
# its subset refuses by name any SHACL term it does not cover.
ikigai-shacl = { version = "0.5.0", default-features = false }
ikigai-secret = "0.3.0"
# forge_reader's own tests, over a canned transport.
ikigai-http = "0.4.3"
