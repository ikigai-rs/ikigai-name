[package]
name = "ikigai-name"
version = "0.1.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Persistent-identifier resolution as an ikigai module: urn:name:* resolves curated IRIs against an externalized, capability-scoped registry — hosted, redirected or mirrored — so a namespace outlives the domain that first served it."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-name"
homepage = "https://github.com/ikigai-rs/ikigai-name"
readme = "README.md"
keywords = ["ikigai", "roc", "iri", "purl", "rdf"]
categories = ["web-programming", "data-structures"]

[dependencies]
# The released kernel, consumed from crates.io — the SAME version the hosts use,
# so a host links exactly one `ikigai-core` (no duplicate-crate type mismatch).
# 0.1.54 is the true minimum: `AsyncFnEndpoint` is what lets a resolve read its
# registry back THROUGH the kernel rather than off the filesystem.
ikigai-core = "0.1.54"
async-trait = "0.1"
# The registry is data the operator edits, so it is parsed, not compiled in.
# JSON matches the house configuration format (edge-routes.json, clients.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The contrast floor. Used for its color maths, so the documentation palettes
# are CHECKED rather than asserted — a page a newcomer must read is the wrong
# place to discover that "muted" meant "illegible".
ikigai-a11y = "0.2.0"

# Server-only. `ikigai-web` is the inbound HTTP transport (method↔verb,
# Accept↔conneg, and a strong ETag with If-None-Match already handled);
# `ikigai-fs` gives golden-threaded urn:file:* so a registry edit invalidates
# rather than needing a restart; `ikigai-sparql` is what the docs face queries
# through.
ikigai-web = { version = "0.1.16", optional = true }
ikigai-fs = { version = "0.1.5", optional = true }
ikigai-sparql = { version = "0.1.6", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

# --- the standalone server ---------------------------------------------------
# Optional, so a library consumer never builds an HTTP stack or RocksDB. The
# feature list IS the server's module manifest, in the ikigai-dev-server sense:
# this binary links these and nothing else, so what it cannot reach is a
# property of the build rather than of a config file.
[features]
server = ["dep:ikigai-web", "dep:ikigai-sparql", "dep:ikigai-fs", "dep:tokio"]

[[bin]]
name = "ikigai-name-server"
path = "src/bin/server.rs"
required-features = ["server"]

[dev-dependencies]
futures = "0.3"
# The module recipe as one test: `tests/conformance.rs` walks every endpoint
# `space()` binds and reports every violation at once.
ikigai-conformance = "0.1.0"
# The real SPARQL engine, so the docs face's term extraction is proved through a
# genuine module boundary rather than a hand-written stub of the results format.
ikigai-sparql = "0.1.6"
