# CI for ikigai-name (`urn:name:*`). Pure Rust with no platform-gated code, so
# the three ordinary gates are the whole story — no macos job, and no wasm-lib
# job until a wasm face exists.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (all targets)
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test
